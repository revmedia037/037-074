						document.addEventListener("DOMContentLoaded", function() {
						  const video = document.getElementById("intro-video");
						  const overlay = document.getElementById("unmute-overlay");
						
						  if (video && overlay) {
						    // Handle global click interaction to unmute
						    overlay.addEventListener("click", function() {
						      video.muted = false;
						      overlay.classList.add("opacity-0", "pointer-events-none");
						      video.play().catch(err => console.log("Playback interaction error:", err));

						    // Intersection Observer to detect video visibility in viewport
						    const observer = new IntersectionObserver(function(entries) {

						        } else {
						          // Video is not visible -> snap fixed to bottom right

						        }
						      });
						    }, {
						      // Trigger change as soon as even 1 pixel of the video element leaves/enters screen

						    observer.observe(video);
